name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Download game APK and extract optional level data
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apkeep" "$RUNNER_TEMP/game-apk"
          curl --fail --location --silent --show-error \
            https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu \
            --output "$RUNNER_TEMP/apkeep/apkeep"
          chmod +x "$RUNNER_TEMP/apkeep/apkeep"

          "$RUNNER_TEMP/apkeep/apkeep" \
            -a com.ecffri.arrows -d apk-pure -o 'acknowledge_dangers=true' \
            "$RUNNER_TEMP/game-apk"

          echo "Downloaded files:"
          find "$RUNNER_TEMP/game-apk" -type f -print

          game_file="$(find "$RUNNER_TEMP/game-apk" -type f \( -iname '*.apk' -o -iname '*.xapk' \) -print -quit)"
          if [ -z "$game_file" ]; then
            echo "apkeep produced no .apk or .xapk file" >&2
            exit 1
          fi

          if [[ "$game_file" == *.xapk ]]; then
            python3 - "$game_file" "$RUNNER_TEMP/game.apk" <<'PY'
          import io
          import sys
          import zipfile

          xapk_path, output_path = sys.argv[1:]
          with zipfile.ZipFile(xapk_path) as xapk:
              apk_files = [name for name in xapk.namelist() if name.lower().endswith(".apk")]
              for name in apk_files:
                  try:
                      payload = xapk.read(name)
                      with zipfile.ZipFile(io.BytesIO(payload)) as apk:
                          if any(
                              item.startswith("assets/aa/Android/levels-")
                              and item.endswith(".bundle")
                              for item in apk.namelist()
                          ):
                              with open(output_path, "wb") as out:
                                  out.write(payload)
                              print(f"Using {name} from XAPK")
                              break
                  except (KeyError, zipfile.BadZipFile):
                      continue
              else:
                  raise SystemExit(
                      "No embedded APK contains the expected game level bundles. "
                      f"APK files in XAPK: {apk_files}"
                  )
          PY
            game_apk="$RUNNER_TEMP/game.apk"
          else
            game_apk="$game_file"
          fi

          python3 -m pip install --disable-pip-version-check 'UnityPy==1.*'
          python3 tools/extract_levels.py "$game_apk"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrows-solver-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
